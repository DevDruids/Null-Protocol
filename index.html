<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./index/styles.css">
  <link rel="stylesheet" href="./utils/bootstrap-icons-1.13.1/bootstrap-icons-1.13.1/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
  >
  <title>NullProtocol | Головна </title>
</head>
<body>
  <canvas id="bgCanvas"></canvas>

  <div class="popUp-content-wrapper" id="popUp-content-wrapper">
    <i class="bi bi-exclamation-triangle"></i>
    Заповніть усі поля для продовження!
  </div>

  <main>
    <header class="auth-header">
      <div class="nodes-threats-wrapper">
        <span>
          <i class="bi bi-wifi"></i>
          NODES: 1,024 ONLINE
        </span>
        <span>
          <i class="bi bi-exclamation-triangle"></i>
          ACTIVE THREATS: 3
        </span>
      </div>
      <div class="nodes-threats-level-wrapper">
        <i class="bi bi-shield-exclamation"></i>
        Threat Level: OMEGA
      </div>
    </header>
    <section class="auth-section">
      <div class="auth-hero">
        <div class="container auth-hero-container">
          <div class="content-wrapper">
            <h1 data-text="NullProtocol">NullProtocol</h1>
            <p>
              Інтерфейс дослідження кібербезпеки
            </p>
            <div class="terminal-wrapper">
              <div class="terminal">
                <div class="typing-text" id="typingText"></div>
              </div>
              <button id="startBtn" onclick="showPopUp()">
                почати розслідування
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="overlay" id="overlay"></div>

    <div class="popup-enter-username" id="popUp">
      <div class="close-btn" onclick="hidePopUp()">
        <i class="bi bi-x-lg"></i>
      </div>
      <div class="popup-content-wrapper">
        <div class="popup-title">
          Ідентифікуйте себе
        </div>
          <div class="popup-description">
            Нейронний зв'язок встановлено. Введіть кодове ім'я слідчого.
          </div>
          <div class="input-field">
            <input id="input-name" type="text" placeholder="Ім'я слідчого" autofocus autocomplete="off">

            <input id="input-password" type="password" placeholder="Пароль" autofocus autocomplete="off">
          </div>
          <div class="init-contect-btn-wrapper">
            <button class="init-conection-btn" onclick="validateInput()">
              Ініціалізація підключення
            </button>
          </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./index/script.js"></script>
  <script src="./index/bg.js"></script>
</body>
</html>
