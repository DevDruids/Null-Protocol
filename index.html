<head>

  <link rel="stylesheet" href="./index/styles.css">
  <link rel="stylesheet" href="./utils/bootstrap-icons-1.13.1/bootstrap-icons-1.13.1/bootstrap-icons.css">

<body>
  <canvas id="bgCanvas"></canvas>

  <main>
    <section class="auth-section">

        <div class="nodes-threats-wrapper">
          <span>
            <i class="bi bi-wifi"></i>
            NODES: 1,024 ONLINE
          </span>
          <span>
            <i class="bi bi-exclamation-triangle"></i>
            ACTIVE THREATS: 3

        </div>

          <i class="bi bi-shield-exclamation"></i>
          Threat Level: OMEGA
        </div>
      </header>
      <div class="auth-hero">
        <div class="container auth-hero-container">
          <div class="content-wrapper">
            <h1 data-text="NullProtocol">NullProtocol</h1>

              Інтерфейс дослідження кібербезпеки

            <div class="terminal-wrapper">
              <div class="terminal">
                <div class="typing-text" id="typingText"></div>
              </div>
              <button id="startBtn">
                почати розслідування
              </button>
          </div>
          </div>
        </div>
      </div>
    </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
