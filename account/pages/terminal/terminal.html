<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../../reset.css">
  <link rel="stylesheet" href="../../../utils/bootstrap-icons-1.13.1/bootstrap-icons-1.13.1/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../utils/bootstrap-css/bootstrap.css">
  <link rel="stylesheet" href="./terminal.css">
  <link rel="icon" href="../../../images/logo.png" type="image/png">
  <title>NullProtocol | Terminal</title>
</head>
<body>
  <header class="header" id="header">
    
    <div class="header-left">
      <h1>Null<span>Protocol</span></h1>
      <div class="line"></div>
      <div id="mySidenav" class="sidenav">
        <a href="../../account.html" class="nav-item">
          <i class="bi bi-boxes"></i>
          dashboard
        </a>
        <a href="../characters/characters.html" class="nav-item">
          <i class="bi bi-people"></i>
          characters
        </a>
        <a href="../board/board.html" class="nav-item">
          <i class="bi bi-clipboard"></i>
          board
        </a>
        <a href="./terminal.html" class="nav-item active">
          <i class="bi bi-terminal"></i>
          terminal
        </a>
        <a href="../progress/progress.html" class="nav-item">
          <i class="bi bi-trophy"></i>
          progress
        </a>
      </div>

      <div class="agent-info">
        <div class="agent-status">
          active agent
        </div>
        <div class="agent-name" id="agent-name">
          GHOST_HUNTER_01
        </div>
        <div class="agent-progress">
          <div class="agent-level">
            lvl 1
          </div>
          <div class="agent-progress-bar-wrapper">
            <div class="agent-progress-bar" style="width: 0%;"></div>
          </div>
        </div>
      </div>

    </div>

    <div class="header-top">
      <div class="header-top-left">
        <span class="sys-text">
          <i class="bi bi-reception-4"></i>
          SYS.NET_ACTIVE
        </span>
      </div>
      <div class="header-top-right">
        <span class="threat-level">
          <i class="bi bi-exclamation-triangle"></i>
          THREAT: ELEVATED
        </span>
        <span class="date" id="current-date"></span>
        <span class="messages">
          <i class="bi bi-bell"></i>
        </span>
      </div>
    </div>
  </header>



  <script src="./terminal.js"></script>
</body>
</html>
